<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sway Away — Where are you going?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0d1b2a;
  --navy-mid:#1a2e45;
  --white:#ffffff;
  --cream:#faf7f2;
  --coral:#ff6b35;
  --sage:#7fb069;
  --sky:#4ecdc4;
  --gold:#f7c948;
  --text:#0d1b2a;
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--navy)}

/* ── SLIDES ── */
.slides{position:fixed;inset:0;z-index:0}
.slide{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.2s ease;
}
.slide.active{opacity:1}
.slide-overlay{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(13,27,42,.4) 0%,
    rgba(13,27,42,.2) 40%,
    rgba(13,27,42,.65) 100%
  );
}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:1.5rem 2.5rem;
  display:flex;justify-content:space-between;align-items:center;
}
.nav-logo img{
  height:22px;width:auto;
  filter:brightness(0) invert(1);
}
.nav-links{
  display:flex;gap:2rem;align-items:center;
}
.nav-link{
  font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.55);text-decoration:none;
  transition:color .2s;font-weight:400;
}
.nav-link:hover{color:#fff}
.nav-cta{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:.5rem 1.25rem;
  font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;
  font-weight:500;text-decoration:none;
  transition:all .25s;backdrop-filter:blur(8px);
}
.nav-cta:hover{background:rgba(255,255,255,.22)}

/* ── HERO CONTENT ── */
.hero{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 1.5rem;
  pointer-events:none;
}

/* SLIDE COUNTER */
.slide-dots{
  position:fixed;right:2rem;top:50%;transform:translateY(-50%);
  z-index:20;display:flex;flex-direction:column;gap:.5rem;
}
.sdot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.3);transition:all .3s;
}
.sdot.on{background:#fff;height:20px;border-radius:2px}

/* TAG */
.hero-tag{
  font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-bottom:1.25rem;
  display:flex;align-items:center;gap:.875rem;
  animation:fadeUp .8s ease .2s both;
}
.hero-tag::before,.hero-tag::after{content:'';width:24px;height:1px;background:rgba(255,255,255,.35)}

/* HEADLINE */
.hero-headline{
  font-family:'Playfair Display',serif;
  font-size:clamp(3rem,8vw,6.5rem);
  font-weight:400;font-style:italic;
  color:#fff;line-height:1;
  text-align:center;
  letter-spacing:-.02em;
  margin-bottom:2.5rem;
  animation:fadeUp .8s ease .4s both;
  pointer-events:none;
}

/* SEARCH BOX */
.search-box{
  width:100%;max-width:680px;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.35);
  animation:fadeUp .8s ease .6s both;
  pointer-events:all;
}
.search-fields{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  border-bottom:1px solid rgba(13,27,42,.08);
}
.search-field{
  padding:1.25rem 1.5rem;
  border-right:1px solid rgba(13,27,42,.08);
  cursor:text;
  transition:background .2s;
}
.search-field:last-child{border-right:none}
.search-field:hover{background:rgba(13,27,42,.03)}
.field-label{
  font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--navy);font-weight:600;margin-bottom:.35rem;
  opacity:.5;
}
.field-input{
  width:100%;border:none;outline:none;background:transparent;
  font-family:'DM Sans',sans-serif;font-size:1rem;
  color:var(--navy);font-weight:400;
  placeholder-color:rgba(13,27,42,.3);
}
.field-input::placeholder{color:rgba(13,27,42,.3)}
.field-input[type="date"]{color-scheme:light}
.field-input[type="number"]{-moz-appearance:textfield}
.field-input[type="number"]::-webkit-outer-spin-button,
.field-input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}

.search-bottom{
  display:flex;justify-content:space-between;align-items:center;
  padding:.875rem 1.5rem;
}
.search-tags{display:flex;gap:.5rem;flex-wrap:wrap}
.search-tag{
  font-size:.56rem;letter-spacing:.1em;
  color:var(--navy);opacity:.4;
  background:rgba(13,27,42,.06);
  padding:.28rem .75rem;border-radius:100px;
  cursor:pointer;transition:all .2s;font-weight:400;
  touch-action:manipulation;
}
.search-tag:hover{opacity:.8;background:rgba(13,27,42,.1)}
.btn-generate{
  background:var(--navy);color:#fff;border:none;
  padding:.875rem 2rem;border-radius:8px;
  font-family:'DM Sans',sans-serif;
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;cursor:pointer;
  transition:all .3s;touch-action:manipulation;
  display:flex;align-items:center;gap:.625rem;
  flex-shrink:0;
  white-space:nowrap;
}
.btn-generate:hover{background:var(--navy-mid);transform:translateY(-1px)}
.btn-generate:active{transform:translateY(0)}
.btn-arrow{font-size:1rem;transition:transform .3s}
.btn-generate:hover .btn-arrow{transform:translateX(3px)}
.btn-wander{
  background:transparent;
  border:1.5px solid rgba(13,27,42,.15);
  color:var(--navy);
  padding:.875rem 1.25rem;border-radius:8px;
  font-family:'DM Sans',sans-serif;
  font-size:.68rem;letter-spacing:.1em;
  font-weight:500;cursor:pointer;
  transition:all .3s;touch-action:manipulation;
  white-space:nowrap;
  display:flex;align-items:center;gap:.4rem;
}
.btn-wander:hover{background:rgba(13,27,42,.06);border-color:rgba(13,27,42,.3)}

/* RECENT CARDS STRIP */
.recent{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:1.25rem 2.5rem 2rem;
  display:flex;align-items:flex-end;gap:1rem;
  animation:fadeUp .8s ease 1s both;
}
.recent-label{
  font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.4);white-space:nowrap;flex-shrink:0;
  padding-bottom:.875rem;
}
.recent-cards{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.25rem}
.recent-cards::-webkit-scrollbar{display:none}
.recent-card{
  flex-shrink:0;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  border-radius:8px;
  padding:.625rem .875rem;
  cursor:pointer;transition:all .25s;
  touch-action:manipulation;
}
.recent-card:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.rc-theme{
  font-size:.42rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.45);margin-bottom:.2rem;
}
.rc-dest{
  font-family:'Playfair Display',serif;
  font-size:.9rem;font-style:italic;color:#fff;
}
.rc-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:.35rem;vertical-align:middle;
}

/* ── LOADING SCREEN ── */
.loading-screen{
  position:fixed;inset:0;z-index:200;
  background:var(--cream);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2rem;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.loading-screen.show{opacity:1;pointer-events:all}
.loading-logo img{height:28px;filter:none}
.loading-spinner{
  width:56px;height:56px;border-radius:50%;
  border:2px solid rgba(13,27,42,.1);
  border-top-color:var(--navy);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-steps{
  display:flex;flex-direction:column;gap:.5rem;
  text-align:center;
}
.loading-step{
  font-size:.75rem;color:rgba(13,27,42,.4);
  letter-spacing:.08em;transition:color .4s,opacity .4s;
  opacity:.4;
}
.loading-step.active{color:var(--navy);opacity:1;font-weight:500}
.loading-step.done{color:var(--sage);opacity:.7}

/* ── ANIMATIONS ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}



/* TRENDING DROPDOWN */
.td-card{
  padding:.875rem 1rem;
  border-bottom:1px solid rgba(13,27,42,.05);
  cursor:pointer;transition:background .2s;
}
.td-card:last-child{border-bottom:none}
.td-card:hover{background:rgba(13,27,42,.03)}
.td-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.td-theme{font-size:.46rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(13,27,42,.4);display:flex;align-items:center;gap:.3rem}
.td-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
.td-dest{font-family:'Playfair Display',serif;font-size:1.1rem;font-style:italic;color:var(--navy);font-weight:400}
.td-desc{font-size:.62rem;color:rgba(13,27,42,.55);line-height:1.55;letter-spacing:.02em;margin-bottom:.4rem}
.td-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.3rem}
.td-tag{font-size:.44rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(13,27,42,.06);color:rgba(13,27,42,.5);padding:.2rem .55rem;border-radius:100px}
.td-time{font-size:.52rem;color:rgba(13,27,42,.35);letter-spacing:.04em}

/* DESTINATION STOPS */
.dest-stop{position:relative}
.stop-num{
  font-size:.6rem;color:rgba(13,27,42,.3);
  flex-shrink:0;width:16px;text-align:center;
}
.stop-remove{
  font-size:.75rem;color:rgba(13,27,42,.25);
  cursor:pointer;flex-shrink:0;padding:0 .2rem;
  transition:color .2s;line-height:1;
  background:none;border:none;font-family:inherit;
}
.stop-remove:hover{color:#ff6b35}
.stop-connector{
  font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(13,27,42,.2);padding-left:1.25rem;margin:.1rem 0;
}

/* TRENDING CARDS — expanded state */
.recent-card{position:relative;transition:all .3s}
.recent-card.expanded{
  background:rgba(255,255,255,.95);
  border-color:rgba(255,255,255,.8);
  color:var(--navy);
  min-width:260px;
}
.recent-cards.has-expanded .recent-card:not(.expanded){
  opacity:.45;
  transform:scale(.97);
}
.rc-expanded-content{
  display:none;margin-top:.625rem;
  padding-top:.625rem;
  border-top:1px solid rgba(13,27,42,.08);
}
.recent-card.expanded .rc-expanded-content{display:block}
.recent-card.expanded .rc-dest{color:var(--navy)}
.recent-card.expanded .rc-theme{color:rgba(13,27,42,.4)}
.rc-exp-why{font-size:.6rem;color:rgba(13,27,42,.65);line-height:1.6;margin-bottom:.5rem;letter-spacing:.02em}
.rc-exp-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.625rem}
.rc-exp-tag{
  font-size:.46rem;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(13,27,42,.07);color:rgba(13,27,42,.6);
  padding:.22rem .6rem;border-radius:100px;
}
.rc-exp-timing{
  font-size:.54rem;color:rgba(13,27,42,.45);
  letter-spacing:.04em;margin-bottom:.625rem;
  display:flex;align-items:center;gap:.35rem;
}
.rc-exp-timing::before{content:'📅';font-size:.6rem}
.btn-build-this{
  width:100%;background:var(--navy);color:#fff;
  border:none;border-radius:6px;padding:.5rem .875rem;
  font-family:'DM Sans',sans-serif;font-size:.58rem;
  letter-spacing:.15em;text-transform:uppercase;font-weight:600;
  cursor:pointer;touch-action:manipulation;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;
}
.btn-build-this:hover{background:var(--navy-mid)}
.rc-close{
  position:absolute;top:.5rem;right:.5rem;
  background:rgba(13,27,42,.08);border:none;border-radius:50%;
  width:18px;height:18px;cursor:pointer;
  font-size:.6rem;color:rgba(13,27,42,.4);
  display:none;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.recent-card.expanded .rc-close{display:flex}

/* PILL BAR */
.pill-bar{
  display:flex;align-items:stretch;
  background:rgba(255,255,255,.97);
  border-radius:100px;
  box-shadow:0 8px 40px rgba(0,0,0,.28);
  backdrop-filter:blur(20px);
  overflow:visible;
  padding:.35rem;
  gap:0;
}
.pill-field{
  padding:.7rem 1.25rem;
  flex:1;cursor:text;
  transition:background .2s;
  border-radius:100px;
  min-width:0;
}
.pill-field.pill-dest{flex:2}
.pill-field.pill-sm{flex:.8}
.pill-field:hover{background:rgba(13,27,42,.04)}
.pill-label{
  font-size:.44rem;letter-spacing:.25em;text-transform:uppercase;
  color:var(--navy);font-weight:700;margin-bottom:.2rem;opacity:.6;
}
.pill-input{
  width:100%;border:none;outline:none;background:transparent;
  font-family:'DM Sans',sans-serif;font-size:.88rem;
  color:var(--navy);font-weight:400;
  display:block;
}
.pill-input::placeholder{color:rgba(13,27,42,.3)}
.pill-input[type="date"]{color-scheme:light}
.pill-input[type="number"]{-moz-appearance:textfield;width:100%}
.pill-input[type="number"]::-webkit-outer-spin-button,
.pill-input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
.pill-divider{
  width:1px;background:rgba(13,27,42,.1);
  margin:.5rem 0;flex-shrink:0;
  align-self:stretch;
}
.pill-actions{
  display:flex;align-items:center;gap:.4rem;
  padding:.2rem .2rem .2rem 0;flex-shrink:0;
}
.pill-btn-build{
  background:var(--navy);color:#fff;border:none;
  border-radius:100px;padding:.75rem 1.5rem;
  font-family:'DM Sans',sans-serif;
  font-size:.65rem;letter-spacing:.12em;
  font-weight:600;cursor:pointer;
  transition:all .25s;touch-action:manipulation;
  white-space:nowrap;
}
.pill-btn-build:hover{background:var(--navy-mid);transform:scale(1.02)}
.pill-btn-surprise{
  background:transparent;color:var(--navy);
  border:1.5px solid rgba(13,27,42,.2);
  border-radius:100px;padding:.75rem 1.25rem;
  font-family:'DM Sans',sans-serif;
  font-size:.65rem;letter-spacing:.12em;
  font-weight:600;cursor:pointer;
  transition:all .25s;touch-action:manipulation;
  white-space:nowrap;
}
.pill-btn-surprise:hover{background:rgba(13,27,42,.06);border-color:rgba(13,27,42,.4)}
.pill-tags{
  display:flex;gap:.5rem;flex-wrap:wrap;
  margin-top:.875rem;justify-content:center;
}
.pill-tag{
  font-size:.58rem;letter-spacing:.08em;
  color:rgba(255,255,255,.65);
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  padding:.3rem .875rem;border-radius:100px;
  cursor:pointer;transition:all .2s;
  touch-action:manipulation;
  backdrop-filter:blur(8px);
}
.pill-tag:hover{background:rgba(255,255,255,.22);color:#fff}
/* ── MOBILE ── */
@media(max-width:640px){
  nav{padding:1.25rem 1.5rem}
  .nav-links{display:none}
  .hero-headline{font-size:2.8rem;margin-bottom:2rem}
  .pill-bar{flex-direction:column;border-radius:20px;padding:.5rem}
  .pill-field{border-radius:12px;padding:.875rem 1.1rem}
  .pill-divider{width:100%;height:1px;margin:.25rem 0}
  .pill-btn-build{width:100%;justify-content:center;text-align:center}
  .btn-wander,
  .btn-surprise{width:100%;justify-content:center}
  .search-tags{display:none}
  .recent{padding:1rem 1.5rem 1.5rem}
  .slide-dots{display:none}
  .rc-expanded-content{font-size:.9em}
}
</style>
</head>

  dots[cur].classList.remove('on');
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add('active');
  dots[cur].classList.add('on');
}
setInterval(nextSlide, 5000);

// DESTINATION QUICK SELECT
function setDest(dest) {
  document.getElementById('destination').value = dest;
  document.getElementById('destination').focus();
}

// GENERATE
function startGenerate() {
  const destInputs = document.querySelectorAll('.dest-input');
  const destinations = Array.from(destInputs).map(i => i.value.trim()).filter(Boolean);
  const dest = destinations.join(' → ');
  if (!dest) {
    document.querySelector('.dest-input').focus();
    document.querySelector('.dest-input').style.borderBottom = '2px solid #ff6b35';
    setTimeout(() => document.querySelector('.dest-input').style.borderBottom = '', 1500);
    return;
  }

  // Save to session
  sessionStorage.setItem('vela_destination', dest);
  localStorage.setItem('vela_last_dest', dest);
  const dates = document.getElementById('dates').value;
  const adults = document.getElementById('adults').value || 2;
  const children = document.getElementById('children').value || 0;
  localStorage.setItem('vela_adults', adults);
  localStorage.setItem('vela_children', children);
  if (dates) localStorage.setItem('vela_dateFrom', dates);

  // Show loading
  const loading = document.getElementById('loadingScreen');
  loading.classList.add('show');

  // Animate steps
  const steps = ['ls0','ls1','ls2','ls3'];
  steps.forEach((id, i) => {
    setTimeout(() => {
      steps.slice(0,i).forEach(prev => {
        document.getElementById(prev).classList.remove('active');
        document.getElementById(prev).classList.add('done');
      });
      document.getElementById(id).classList.add('active');
    }, i * 1200);
  });

  // Redirect to planner after steps
  setTimeout(() => {
    window.location.href = 'vela-planner.html';
  }, steps.length * 1200 + 800);
}


// TRENDING DROPDOWN
let trendingOpen = false;
function toggleTrending() {
  trendingOpen = !trendingOpen;
  const dd = document.getElementById('trendingDropdown');
  const arrow = document.getElementById('trendingArrow');
  dd.style.display = trendingOpen ? 'block' : 'none';
  arrow.style.transform = trendingOpen ? 'rotate(180deg)' : 'rotate(0)';
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
  if (!document.getElementById('trendingField').contains(e.target)) {
    document.getElementById('trendingDropdown').style.display = 'none';
    document.getElementById('trendingArrow').style.transform = 'rotate(0)';
    trendingOpen = false;
  }
});

// MULTI-DESTINATION STOPS
let stopCount = 1;
const stopLabels = ['✈', '→', '→', '→'];

function addDestination() {
  if (stopCount >= 4) return;
  const container = document.getElementById('destInputs');

  // Add connector
  const connector = document.createElement('div');
  connector.className = 'stop-connector';
  connector.textContent = 'then';
  container.appendChild(connector);

  // Add new stop
  const stop = document.createElement('div');
  stop.className = 'dest-stop';
  stop.style.cssText = 'display:flex;align-items:center;gap:.4rem;animation:fadeUp .3s ease both';
  stop.innerHTML = `
    <span class="stop-num">${stopLabels[stopCount]}</span>
    <input class="field-input dest-input" type="text" placeholder="Next stop..." autocomplete="off" style="flex:1">
    <button class="stop-remove" onclick="removeStop(this)">✕</button>
  `;
  container.appendChild(stop);
  stopCount++;
  stop.querySelector('input').focus();

  if (stopCount >= 4) {
    document.getElementById('addStopBtn').style.opacity = '0.2';
    document.getElementById('addStopBtn').style.pointerEvents = 'none';
  }
}

function removeStop(btn) {
  const stop = btn.closest('.dest-stop');
  const connector = stop.previousElementSibling;
  if (connector && connector.classList.contains('stop-connector')) connector.remove();
  stop.remove();
  stopCount--;
  document.getElementById('addStopBtn').style.opacity = '.8';
  document.getElementById('addStopBtn').style.pointerEvents = 'all';
}

// TRENDING CARD EXPANSION
function expandCard(card, dest, theme) {
  if (card.classList.contains('expanded')) return;
  collapseAll();
  card.classList.add('expanded');
  document.getElementById('trendingCards').classList.add('has-expanded');
  card.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function collapseCards(e) {
  e.stopPropagation();
  collapseAll();
}

function collapseAll() {
  document.querySelectorAll('.recent-card').forEach(c => c.classList.remove('expanded'));
  document.getElementById('trendingCards').classList.remove('has-expanded');
}

function buildThis(e, dest, theme) {
  if (e) e.stopPropagation();
  document.querySelector('.dest-input').value = dest;
  sessionStorage.setItem('vela_theme', theme);
  // Close dropdown
  document.getElementById('trendingDropdown').style.display = 'none';
  trendingOpen = false;
  startGenerate();
}

// ENTER key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') startGenerate();
});
